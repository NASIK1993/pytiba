name: Character Studio APK

on:
  push:
    paths:
      - 'character-studio/**'
      - '.github/workflows/character-studio-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: character-studio
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: character-studio/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install & build web app
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build debug APK
        working-directory: character-studio/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v5
        with:
          name: character-studio-debug-apk
          path: character-studio/android/app/build/outputs/apk/debug/app-debug.apk
